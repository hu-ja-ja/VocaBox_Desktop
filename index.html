<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocaBox</title>
  </head>
  <body>
    <header>
      <h1>VocaBox</h1>
      <p>公開マイリストの表示ができます。再生は準備中のため、操作できません。</p>
    </header>
    <main>
      <section aria-labelledby="library-heading">
        <h2 id="library-heading">マイリスト</h2>
        <p>公開マイリストの表示には非公式のAPIを使っています。</p>
        <form id="mylist-form">
          <label for="mylist-input">マイリストのIDまたはURL</label>
          <input
            id="mylist-input"
            name="mylist"
            type="text"
            required
            autocomplete="off"
            spellcheck="false"
            placeholder="例: https://www.nicovideo.jp/mylist/12345678"
          />
          <button type="submit">読み込む</button>
        </form>
        <p id="mylist-status" role="status"></p>
        <div id="mylist-result" hidden>
          <h3 id="mylist-name"></h3>
          <p id="mylist-meta"></p>
          <p id="mylist-description"></p>
          <ol id="mylist-items"></ol>
          <button id="mylist-more" type="button" hidden>もっと読み込む</button>
        </div>
      </section>
      <section aria-labelledby="now-playing-heading">
        <h2 id="now-playing-heading">再生中</h2>
        <p id="now-playing">再生中の曲はありません。</p>
      </section>
    </main>
    <footer aria-label="再生操作">
      <button type="button" disabled>シャッフル</button>
      <button type="button" disabled>前へ</button>
      <button type="button" disabled>再生</button>
      <button type="button" disabled>次へ</button>
      <button type="button" disabled>ループ</button>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
