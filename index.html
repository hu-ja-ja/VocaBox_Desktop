<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocaBox</title>
  </head>
  <body>
    <header>
      <h1>VocaBox</h1>
      <p>マイリスト取り込み・再生は準備中のため、操作できません。</p>
    </header>
    <main>
      <section aria-labelledby="library-heading">
        <h2 id="library-heading">マイリスト</h2>
        <p>取り込み機能が未実装のため、一覧はまだ表示できません。</p>
      </section>
      <section aria-labelledby="now-playing-heading">
        <h2 id="now-playing-heading">再生中</h2>
        <p id="now-playing">再生中の曲はありません。</p>
      </section>
    </main>
    <footer aria-label="再生操作">
      <button type="button" disabled>シャッフル</button>
      <button type="button" disabled>前へ</button>
      <button type="button" disabled>再生</button>
      <button type="button" disabled>次へ</button>
      <button type="button" disabled>ループ</button>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
