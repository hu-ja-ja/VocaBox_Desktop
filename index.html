<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocaBox</title>
  </head>
  <body>
    <header>
      <h1>VocaBox</h1>
      <p>公開マイリストの表示ができます。埋め込み再生の操作部は実装済みですが、MyGo WebViewでの再生・再生数への加算は未確認です。</p>
    </header>
    <main>
      <section aria-labelledby="library-heading">
        <h2 id="library-heading">マイリスト</h2>
        <p>公開マイリストの表示には非公式のAPIを使っています。</p>
        <form id="mylist-form">
          <label for="mylist-input">マイリストのIDまたはURL</label>
          <input
            id="mylist-input"
            name="mylist"
            type="text"
            required
            autocomplete="off"
            spellcheck="false"
            placeholder="例: https://www.nicovideo.jp/mylist/12345678"
          />
          <button type="submit">読み込む</button>
        </form>
        <p id="mylist-status" role="status"></p>
        <div id="mylist-result" hidden>
          <h3 id="mylist-name"></h3>
          <p id="mylist-meta"></p>
          <p id="mylist-description"></p>
          <ol id="mylist-items"></ol>
          <button id="mylist-more" type="button" hidden>もっと読み込む</button>
          <button id="mylist-save" type="button">このマイリストを保存</button>
        </div>
      </section>
      <section aria-labelledby="saved-heading">
        <h2 id="saved-heading">保存したマイリスト</h2>
        <p>読み込んだ公開マイリストの内容をこのPCに保存できます。一覧は保存内容から表示し、最新にするには「更新」を押します。</p>
        <ul id="saved-list"></ul>
        <p id="saved-status" role="status"></p>
      </section>
      <section aria-labelledby="now-playing-heading">
        <h2 id="now-playing-heading">再生中</h2>
        <p id="now-playing">再生中の曲はありません。</p>
        <div id="player-slot"></div>
        <p id="player-status" role="status"></p>
      </section>
    </main>
    <footer aria-label="再生操作">
      <button id="shuffle-toggle" type="button" disabled aria-pressed="false">シャッフル</button>
      <button id="prev-track" type="button" disabled>前へ</button>
      <button id="player-toggle" type="button" disabled>再生</button>
      <button id="seek-back" type="button" disabled>10秒戻る</button>
      <button id="seek-forward" type="button" disabled>10秒進む</button>
      <label for="player-volume">音量</label>
      <input id="player-volume" type="range" min="0" max="100" value="100" disabled />
      <button id="next-track" type="button" disabled>次へ</button>
      <button id="loop-toggle" type="button" disabled aria-pressed="false">ループ</button>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
