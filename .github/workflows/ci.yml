name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # mise.toml is the only source of the tool versions (Go, Rust, mr-boxington
      # and the licence tools), so CI installs what a developer's mise install does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
      # The helper first: the app bundles resources/AmsHelper.exe, and its
      # smoke test only runs once the file is there.
      - run: mise run helper
      - run: go vet ./...
      - run: go test ./...
      - run: mise run build
