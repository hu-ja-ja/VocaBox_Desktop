name: Release

# Publishing a release starts the build: mygo build -upload puts the installers
# and the signed updates on that release. The notes of the update window come
# from CHANGELOG.md; a draft can be reviewed and edited before it is published.
on:
  release:
    types: [published]

permissions:
  contents: write # the uploads to the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      # mygo build uploads to the release of the version in mygo.json, so the
      # release's tag has to name the same version before anything builds.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check the version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "$env:RELEASE_TAG") {
            throw "the release tag $env:RELEASE_TAG does not match the version $version of mygo.json (expected v$version)"
          }
      # mise.toml is the only source of the tool versions (Go and Rust), so the
      # release builds what a developer's mise install builds.
      - uses: jdx/mise-action@v5
      # mygo build downloads NSIS on a fresh runner; the cache keeps it.
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      # The app bundles resources/AmsHelper.exe, which the helper task builds.
      - run: mise run helper
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64 -upload
